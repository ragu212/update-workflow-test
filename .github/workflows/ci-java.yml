# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Java (Maven) CI — generated by LaneSync.
# Runs mvn verify (Surefire + JaCoCo), collects HTML reports, uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "main", "main*" ]
  push:
    branches: [ "main", "main*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: |
          if [ -f pom.xml ]; then
            mvn -B test || TEST_EXIT=$?
            mkdir -p coverage
            if [ -d target/site/jacoco ]; then cp -r target/site/jacoco/* coverage/ 2>/dev/null || true; fi
            if [ -f target/site/jacoco/jacoco.xml ]; then cp target/site/jacoco/jacoco.xml coverage/cobertura.xml 2>/dev/null || true; fi
            echo "<html><body><h1>Unit Tests (Surefire)</h1><pre>$(cat target/surefire-reports/*.txt 2>/dev/null | head -200 || echo 'no surefire reports')</pre></body></html>" > unit-tests.html
          else
            echo "No pom.xml found — skipping Maven build. Add a pom.xml to get started."
          fi
          [ -f unit-tests.html ] || echo "<html><body><h1>Unit Tests</h1><p>No tests yet — add a pom.xml and test suite to get started.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure Failsafe integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     mvn -B verify -DskipUnitTests=true
      #     echo "<html><body><h1>Integration Tests</h1><pre>$(cat target/failsafe-reports/*.txt 2>/dev/null | head -200)</pre></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep scan --config auto --sarif -o sast.sarif . 2>/dev/null || true
          COUNT=$(jq '[.runs[].results[]] | length' sast.sarif 2>/dev/null || echo 0)
          echo "<html><body><h1>SAST (OpenGrep)</h1><p>Findings: ${COUNT}</p></body></html>" > sast-scan-report.html

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy.txt
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Render CVE report
        if: always()
        run: |
          echo "<html><body><h1>CVE (Trivy)</h1><pre>$(cat trivy.txt 2>/dev/null | head -200 || echo 'no audit output')</pre></body></html>" > cve-scan.html

      - name: Build evidence metrics
        if: always()
        run: |
          UNIT_TOTAL=0 UNIT_PASSED=0 UNIT_FAILED=0
          if [ -d target/surefire-reports ]; then
            UNIT_TOTAL=$( (grep -h -c '<testcase ' target/surefire-reports/TEST-*.xml 2>/dev/null || true) | awk '{s+=$1} END {print s+0}')
            UNIT_FAILED=$( (grep -h -cE '<(failure|error) ' target/surefire-reports/TEST-*.xml 2>/dev/null || true) | awk '{s+=$1} END {print s+0}')
            UNIT_PASSED=$((UNIT_TOTAL - UNIT_FAILED))
          fi
          COV_PCT=0
          JACOCO_XML=""
          [ -f coverage/cobertura.xml ] && JACOCO_XML=coverage/cobertura.xml
          [ -z "$JACOCO_XML" ] && [ -f target/site/jacoco/jacoco.xml ] && JACOCO_XML=target/site/jacoco/jacoco.xml
          if [ -n "$JACOCO_XML" ]; then
            RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$JACOCO_XML" 2>/dev/null | head -1 || echo "")
            [ -n "$RATE" ] && COV_PCT=$(python3 -c "print(int(float('$RATE')*100))" 2>/dev/null || echo 0)
          fi
          SAST_CRIT=0 SAST_HIGH=0
          if [ -f sast.sarif ]; then
            SAST_CRIT=$(jq '[.runs[].results[] | select(.level=="error")] | length' sast.sarif 2>/dev/null || echo 0)
            SAST_HIGH=$(jq '[.runs[].results[] | select(.level=="warning")] | length' sast.sarif 2>/dev/null || echo 0)
          fi
          CVE_CRIT=0 CVE_HIGH=0
          if [ -f trivy.txt ]; then
            CVE_CRIT=$(grep -c CRITICAL trivy.txt 2>/dev/null || true); CVE_CRIT=${CVE_CRIT:-0}
            CVE_HIGH=$(grep -c HIGH trivy.txt 2>/dev/null || true); CVE_HIGH=${CVE_HIGH:-0}
          fi
          jq -n \
            --argjson unit_total "${UNIT_TOTAL:-0}" \
            --argjson unit_passed "${UNIT_PASSED:-0}" \
            --argjson unit_failed "${UNIT_FAILED:-0}" \
            --argjson cov_pct "${COV_PCT:-0}" \
            --argjson sast_crit "${SAST_CRIT:-0}" \
            --argjson sast_high "${SAST_HIGH:-0}" \
            --argjson cve_crit "${CVE_CRIT:-0}" \
            --argjson cve_high "${CVE_HIGH:-0}" \
            '{
              unit_tests: { total: $unit_total, passed: $unit_passed, failed: $unit_failed },
              integration_tests: { total: 0, passed: 0, failed: 0 },
              coverage: { line_percent: $cov_pct },
              sast_scan: { vulnerabilities: { critical: $sast_crit, high: $sast_high, medium: 0 }, scanned_files: 0 },
              security: { tool: "trivy", vulnerabilities: { critical: $cve_crit, high: $cve_high, medium: 0 } }
            }' > sdlc-evidence.json

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            sdlc-evidence.json
            unit-tests.html
            integration-tests.html
            coverage/
            sast-scan-report.html
            cve-scan.html
            target/surefire-reports/
          retention-days: 30

      - name: Upload evidence to LaneSync
        if: always()
        env:
          SDLC_API_URL: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
        run: |
          REF="${GITHUB_REF#refs/heads/}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ENVIRONMENT=production
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ "$REF" = "main" ]; then
            ENVIRONMENT=dev
            VERSION=dev
          elif case "$REF" in main*) true;; *) false;; esac; then
            ENVIRONMENT=staging
            VERSION="${REF#main}"
          else
            echo "Not an evidence branch — skipping upload."
            exit 0
          fi

          REPORT_JSON="[]"
          if [ -d target/surefire-reports ]; then
            FIRST_XML=$(find target/surefire-reports -name 'TEST-*.xml' -print -quit 2>/dev/null || true)
            if [ -n "$FIRST_XML" ] && [ -f "$FIRST_XML" ]; then
              REPORT_JSON=$(jq -n --rawfile c "$FIRST_XML" --arg fn "$(basename "$FIRST_XML")" '[{filename:$fn,content:$c}]')
            fi
          fi

          if [ -n "${{ secrets.LANESYNC_API_KEY }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.LANESYNC_API_KEY }}"
          else
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lanesync" | jq -r .value)
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi
          PAYLOAD=$(jq -n \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --arg version "$VERSION" \
            --arg environment "$ENVIRONMENT" \
            --argjson metrics "$(cat sdlc-evidence.json)" \
            --argjson test_report_files "$REPORT_JSON" \
            --rawfile unit_html unit-tests.html \
            --rawfile integration_html integration-tests.html \
            --rawfile coverage_html coverage/index.html \
            --rawfile sast_html sast-scan-report.html \
            --rawfile cve_html cve-scan.html \
            '{ org: $org, repo: $repo, version: $version, environment: $environment, pipeline: "CI — Build & Test", metrics: $metrics, test_report_files: $test_report_files,
               reports: { unit_tests: $unit_html, integration_tests: $integration_html, coverage: $coverage_html, sast_scan: $sast_html, security: $cve_html } }')
          curl -s -X POST "$SDLC_API_URL/api/evidence/upload" -H "Content-Type: application/json" -H "$AUTH_HEADER" -d "$PAYLOAD" || echo "Evidence upload failed (non-blocking)."

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      HAS_APP_TOKEN: ${{ secrets.SDLC_APP_PRIVATE_KEY != '' && secrets.SDLC_APP_ID != '' }}
    steps:
      - name: Generate App Token
        id: generate-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Checkout Code
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Generate and Push Tag
        if: env.HAS_APP_TOKEN == 'true'
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == main* ]]; then
            VERSION=${BRANCH_NAME#main}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Pushed tag: $NEW_TAG"
